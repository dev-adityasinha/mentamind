services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentamind}
      POSTGRES_DB: ${POSTGRES_DB:-mentamind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentamind} -d ${POSTGRES_DB:-mentamind}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mentamind}:${POSTGRES_PASSWORD:-mentamind}@postgres:5432/${POSTGRES_DB:-mentamind}
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-zaid@mentamind.in}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Trust X-Forwarded-For: the web container proxies auth calls server-side,
      # so without this every user's request is attributed to its IP.
      BEHIND_PROXY: ${BEHIND_PROXY:-true}
      # Auth rate limits, raised for local dev. A browser talking straight to
      # the Next.js server has no upstream setting X-Forwarded-For, so all
      # proxied logins still share one bucket here; the shipped default of 5 per
      # 15 min locks you out after a few attempts. Production keeps the strict
      # defaults from app/settings.py.
      AUTH_LOGIN_RATE_LIMIT_CALLS: ${AUTH_LOGIN_RATE_LIMIT_CALLS:-100}
      AUTH_REGISTER_RATE_LIMIT_CALLS: ${AUTH_REGISTER_RATE_LIMIT_CALLS:-50}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      MEDIA_DIR: /app/media
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8000/media}
    volumes:
      # Persist uploaded audio across rebuilds.
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Must be a build arg, not just a runtime env var: Next.js inlines
        # NEXT_PUBLIC_* into the client bundle during `next build`. This is the
        # browser-facing origin, so it stays localhost even though the
        # server-side API_URL below uses the compose network name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
